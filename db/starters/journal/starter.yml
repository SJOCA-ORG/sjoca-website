title: Journal
summary: >
  Words first. Generous type, one column, nothing competing with the sentence
  you are reading. For anybody who writes more than they announce.
settings:
  brand: ""
  theme_color: "#2B2118"
pages:
  - slug: home
    title: Journal
    nav_title: Home
    show_in_nav: true
    sections:
      - style: plain
        blocks:
          - kind: heading
            content: Latest
          - kind: text
            content: >
              Put the most recent piece here in full, or its first paragraph
              with a link. A list of titles makes a reader choose before they
              have been given a reason to.
          - kind: quote
            content: >
              A pulled line, which is what a reader's eye lands on before they
              decide whether to start.
          - kind: text
            content: >
              Keep going. This starter sets the measure wide enough to read and
              narrow enough not to tire — about seventy characters a line, which
              is what the type scale below is for.
  - slug: archive
    title: Archive
    nav_title: Archive
    show_in_nav: true
    sections:
      - style: plain
        blocks:
          - kind: heading
            content: Everything so far
          - kind: list
            content: |
              A piece, with its date
              Another, older
              A third, older still
  - slug: about
    title: About
    nav_title: About
    show_in_nav: true
    sections:
      - style: plain
        blocks:
          - kind: heading
            content: About
          - kind: text
            content: Who writes this, and why they started.
