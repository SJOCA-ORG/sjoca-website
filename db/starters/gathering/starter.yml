title: Gathering
summary: >
  A tall opening image, then bands of alternating colour down the page. Suits a
  group that meets somewhere — the front page answers "what is this and when",
  and the rest is detail.
settings:
  brand: ""
  theme_color: "#2F4858"
pages:
  - slug: home
    title: Welcome
    nav_title: Home
    show_in_nav: true
    hero_heading: A place to gather
    hero_subheading: Everyone is welcome, including the first time
    hero_size: tall
    sections:
      - style: plain
        blocks:
          - kind: heading
            content: When we meet
          - kind: text
            content: >
              Put your regular times here. People come to a website for this
              before anything else, and they come back for it when they have
              forgotten.
      - style: light
        blocks:
          - kind: heading
            content: Coming up
          - kind: list
            content: |
              An event, with the date people need
              Another, with somewhere to put the details
              A third, so the shape of the list is obvious
      - style: maroon
        blocks:
          - kind: heading
            content: New here?
          - kind: text
            content: >
              Say what happens when somebody arrives who has never been before:
              where to park, which door, what to expect, who will say hello.
          - kind: button
            content: How to find us
            url: /visit
  - slug: about
    title: About us
    nav_title: About
    show_in_nav: true
    sections:
      - style: plain
        blocks:
          - kind: heading
            content: About us
          - kind: text
            content: >
              A few paragraphs on who you are and how long you have been here.
              Short is better than complete.
  - slug: visit
    title: How to find us
    nav_title: Visit
    show_in_nav: true
    sections:
      - style: plain
        blocks:
          - kind: heading
            content: How to find us
          - kind: text
            content: >
              The address, the nearest landmark, and the door to use. Add a map
              link — people navigate with their phone in their hand.
