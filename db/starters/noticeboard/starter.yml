title: Noticeboard
summary: >
  What is happening, and when. The front page is a list that changes often;
  everything else sits behind it. Suits a group whose news IS the website.
settings:
  brand: ""
  theme_color: "#1F3A2E"
pages:
  - slug: home
    title: Noticeboard
    nav_title: Home
    show_in_nav: true
    hero_heading: What is on
    hero_size: standard
    sections:
      - style: plain
        blocks:
          - kind: heading
            content: This week
          - kind: list
            content: |
              Monday — something regular, with its time
              Thursday — something else, with where it happens
              Saturday — the one people ask about most
          - kind: text
            content: >
              Keep this list short and current. A page that is three weeks out
              of date teaches people to stop looking, and they do not come back
              to check whether it improved.
      - style: light
        blocks:
          - kind: subheading
            content: Notices
          - kind: list
            content: |
              A short notice that fits on one line
              Another, with a name and a telephone number
              A third, which can be deleted once it has happened
  - slug: calendar
    title: Calendar
    nav_title: Calendar
    show_in_nav: true
    sections:
      - style: plain
        blocks:
          - kind: heading
            content: Calendar
          - kind: text
            content: >
              A longer view than the front page. If you keep a calendar
              somewhere else, it can be brought in and shown here rather than
              typed twice.
  - slug: contact
    title: Contact
    nav_title: Contact
    show_in_nav: true
    sections:
      - style: plain
        blocks:
          - kind: heading
            content: Get in touch
          - kind: text
            content: >
              Who to ask, and how. One name and one address people can actually
              reach beats a form nobody checks.
