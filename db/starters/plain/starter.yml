title: Plain
summary: >
  One page, no decoration, nothing to undo. The right choice when you know what
  you want to say and would rather not argue with a layout first.
settings:
  brand: ""
pages:
  - slug: home
    title: Welcome
    nav_title: Home
    show_in_nav: true
    sections:
      - style: plain
        blocks:
          - kind: heading
            content: Welcome
          - kind: text
            content: >
              This is your new website. Nothing here was written by anybody who
              knows you, so all of it is meant to be replaced — ask for the
              changes you want in plain words and look at them before anyone
              else does.
          - kind: subheading
            content: Where to start
          - kind: list
            content: |
              Tell the editor what this site is for, and who it is for
              Say what should be on the front page first
              Add the addresses, times and names people come here to find
