    - kind: heading
      content: 'October 11th: Fathers of the 7th Ecumenical Council'
      align: center
      width: 546
      row: 0
      column: 1
      position: 0
  - style: plain
    column_widths: '1138'
    blocks:
    - kind: heading
      content: Fathers of the 7th Ecumenical Council
      align: center
      width: 1138
      row: 0
      column: 0
      position: 0
    - kind: text
      content: Most feast days celebrated in the Orthodox Church focus on the remembrance of Jesus Christ,
        the Mother of God, or other saintly persons. Celebrated as well are other feast days remembering
        specific miracle working icons of Christ or the Theotokos. The Holy Fathers of the Seventh Ecumenical
        Council, known for generating the theological defense for restoring icons to Church life, also
        constitutes a glorious feast celebrated by the Church. This council whose official date is AD
        787 was the second held in the city of Nicaea, and is sometimes referred to as Nicaea II. This
        council is famous for sanctioning the use of icons in our churches and homes.
      align: left
      width: 1138
      row: 0
      column: 0
      position: 1
  - style: maroon
    column_widths: '1138'
    blocks:
