      position: 2
  - style: maroon
    column_widths: '1138'
    blocks:
    - kind: heading
      content: 'Epistle Reading: 2 Corinthians 11:31-12:9'
      align: center
      width: 1138
      row: 0
      column: 0
      position: 0
    - kind: text
      content: 31 The God and Father of the Lord Jesus, <a href="https://biblia.com/bible/esv/2-corinthians-11-31--12-9#footnote2">t</a>he
        who is blessed forever, knows that I am not lying. 32 At Damascus, the governor under King Aretas
        was guarding the city of Damascus in order to seize me, 33 but I was let down in a basket through
        a window in the wall and escaped his hands. 12 I must go on boasting. Though there is nothing
        to be gained by it, I will go on to visions and revelations of the Lord. 2 I know a man <a href="https://biblia.com/bible/esv/2-corinthians-11-31--12-9#footnote7">y</a>in
        Christ who fourteen years ago was caught up to the third heaven—whether in the body or out of
        the body I do not know, God knows. 3 And I know that this man was caught up into paradise—whether
        in the body or out of the body I do not know, God knows— 4 and he heard things that cannot be
        told, which man may not utter. 5 On behalf of this man I will boast, but on my own behalf I will
        not boast, except of my weaknesses— 6 though if I should wish to boast, <a href="https://biblia.com/bible/esv/2-corinthians-11-31--12-9#footnote14">e</a>I
        would not be a fool, for I would be speaking the truth; but I refrain from it, so that no one
        may think more of me than he sees in me or hears from me. 7 So to keep me from becoming conceited
        because of the surpassing greatness of the revelations,<a href="https://biblia.com/bible/esv/2-corinthians-11-31--12-9#footnote16">1</a>
        a thorn was given me in the flesh, <a href="https://biblia.com/bible/esv/2-corinthians-11-31--12-9#footnote18">h</a>a
        messenger of Satan to harass me, to keep me from becoming conceited. 8 Three times I pleaded with
        the Lord about this, that it should leave me. 9 But he said to me, “My grace is sufficient for
        you, for<a href="https://biblia.com/bible/esv/2-corinthians-11-31--12-9#footnote21">k</a>my power
        is made perfect in weakness.” Therefore I will boast all the more gladly of my weaknesses, so
        that the power of Christ may rest upon me.
      align: left
      width: 1138
      row: 0
      column: 0
      position: 1
    - kind: heading
      content: 'Gospel Reading: Luke 7:11-16'
      align: center
      width: 1138
      row: 0
      column: 0
      position: 2
    - kind: text
      content: Soon afterward Jesus went with his disciples to the village of Nain, and a large crowd
        followed him. A funeral procession was coming out as he approached the village gate. The young
        man who had died was a widow’s only son, and a large crowd from the village was with her. When
        the Lord saw her, his heart overflowed with compassion. “Don’t cry!” he said. Then he walked over
        to the coffin and touched it, and the bearers stopped. “Young man,” he said, “I tell you, get
        up.” Then the dead boy sat up and began to talk! And Jesus gave him back to his mother. Great
        fear swept the crowd, and they praised God, saying, “A mighty prophet has risen among us,” and
        “God has visited his people today.”
      align: left
      width: 1138
      row: 0
      column: 0
      position: 3
