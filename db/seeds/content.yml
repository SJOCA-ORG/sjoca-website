    - kind: text
      content: Grant, O Lord, a prosperous and peaceful life, health, salvation, and furtherance in all
        good things unto Thy servants Sonya who is celebrating her birthday and preserve her, O Lord,
        for many years!
      align: left
      width: 1138
      row: 0
