- slug: events-services/miter-ceremony
  sections:
  - style: plain
    column_widths: '1138'
    blocks:
    - kind: heading
      content: CONGRATULATIONS Father Ken Stavrevsky!!
      align: center
      width: 1138
      row: 0
      column: 0
      position: 0
  - style: plain
    column_widths: 464,645
    blocks:
    - kind: image
      align: center
      url: null
      asset_name: events-services-miter-ceremony-01
      width: 464
      row: 0
      column: 0
      position: 0
    - kind: heading
      content: Father Ken James Stavrevsky Archpriest, Orthodox Church of America, Lieutenant Colonel,
        USAF (Retired)
      align: left
      width: 645
      row: 0
      column: 1
      position: 0
    - kind: text
      content: 'Very Reverend Ken James Stavrevsky and Natalie Eskoff were joined in Holy Matrimony on
        17 August 1975. They are the proud parents of Victoria Stavrevsky. He was ordained to the priesthood
        in the Orthodox Church in America (OCA) on 16 December 1978. He served as pastor of Saints Constantine
        and Helen Church in Colorado Springs, Colorado from June 1979 to February 1982, where he was commissioned
        as a chaplain in the United States Air Force Reserve on 15 March 1981. He entered active duty
        in the Air Force on 22 February 1982. During his military career, he served principally in the
        capacity of “Orthodox Chaplain” with associated duties and responsibilities consistent with the
        mission of the Chaplain Service. In addition to providing pastoral care for Orthodox personnel,
        his broader role as a chaplain included: pastoral counseling, religious/moral education, visitation
        ministry, providing for the free exercise of religion for military members and families, and advising
        military commanders in matters of religious accommodation and moral issues during the planning
        and conduct of war. Chaplain Stavrevsky retired from active duty in the United States Air Force
        on 1 April 2002, having served with distinction for 20 years and 4 months. Following his military
        retirement, he was attached to the Orthodox Church in America, Diocese of Washington DC, and Saint
        Luke Orthodox Church in McLean, Virginia. Father Stavrevsky also served as interim pastor in several
        parishes, for varying lengths of time, including: Saint Mark Orthodox Church (OCA; Bethesda, Maryland),
        Saint George Bulgarian Orthodox Church (OCA; Potomac, Maryland), and Saint Thomas the Apostle
        Orthodox Church (American Carpatho-Russian Orthodox Diocese; Waldorf, Maryland). In addition to
        his pastoral work, from September 2002 to December 2003 he was an adjunct professor of English
        at the College of Southern Maryland where he taught classes in writing, literature, and business
        communications. He was assigned as pastor of Saint John the Baptist Orthodox Church in Rochester,
        New York on 1 January 2004. He was appointed Director of Communications for the Diocese of New
        York and New Jersey (Orthodox Church in America) and member of the Council of Presbyters (June
        2010). Following election to serve on the Diocesan Council, he was appointed as Council Secretary
        (Dec 2010). On 1 January 2021 he retired from active parish ministry having been rector at Saint
        John the Baptist Orthodox Church for 17 years. Father Stavrevsky enjoys writing and public speaking;
        he has lectured, written, and presented papers in the fields of ethics and character development;
        his poetry has been published in “Connections” and “Potomac Review.” He and Matushka Natalie currently
        reside in Pawleys Island, South Carolina.'
      align: left
      width: 645
      row: 0
      column: 1
      position: 1
  - style: plain
    column_widths: 464,645
    blocks:
    - kind: image
      align: center
      url: null
      asset_name: events-services-miter-ceremony-02
      width: 464
      row: 0
      column: 0
      position: 0
    - kind: heading
      content: What is a Miter?
      align: left
      width: 645
      row: 0
      column: 1
      position: 0
    - kind: text
      content: The miter, also spelled mitre, in Orthodox Christian usage is a type of head-covering worn
        by certain <a href="https://orthodoxwiki.org/Clergy">clergy</a> of the Orthodox Church as a part
        of their ceremonial dress. The word is derived from the Greek μίτρα, meaning a &#39;headband&#39;
        or &#39;turban&#39;.
      align: left
      width: 645
      row: 0
      column: 1
      position: 1
    - kind: text
      content: 'A head-covering, as a mark of position of certain religious and secular officials, has
        a long history. In ancient Israel the Jewish high priest (Kohen Gadol) wore a headdress called
        the Mitznefetthat wound around the head to form a broad, flat-top topped turban. Officials of
        the court of the Eastern Roman Empire wore a cap called the camelaucum (Greek: καμιλαύκιον kamilaukion)
        that developed into the imperial crown by the ninth century. A miter in the imperial form was
        not use by Orthodox bishops until after the <a href="https://orthodoxwiki.org/Fall_of_Constantinople">fall
        of Constantinople</a> in 1453. Today, the typical miter in Orthodox churches is based on the imperial
        crown of the late Eastern Roman Empire.'
      align: left
      width: 645
      row: 0
      column: 1
      position: 2
    - kind: text
      content: The present day miter is made in the shape of a bulbous crown and may be constructed of
        number of materials such as brocade, damask, or cloth of gold. Embroidery may be used in its construction
        as well as use of jewels for decoration. The miters, while often of gold, may use other liturgical
        colors. Normally, there are four icons attached to the miter. These usually are icons of <a href="https://orthodoxwiki.org/Jesus">Jesus</a>
        Christ, the <a href="https://orthodoxwiki.org/Theotokos">Theotokos</a>, <a href="https://orthodoxwiki.org/John_the_Forerunner">John
        the Baptist</a>, and the Cross. A cross surmounts the miter, either upright for <a href="https://orthodoxwiki.org/Bishop">bishop</a>’s
        miters or laying flat on miters awarded to <a href="https://orthodoxwiki.org/Priests">priests</a>.
      align: left
      width: 645
      row: 0
      column: 1
      position: 3
