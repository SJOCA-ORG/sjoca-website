# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Creates everything in one go: the web service, a managed Postgres, and the
# three sync jobs. Deploys on push.
#
# Set up in Render once, then nothing here needs touching except to change the
# schedule or add a job.
#
# Two things are NOT handled automatically and must be done by hand once:
#
#   1. RAILS_MASTER_KEY — copy from config/master.key, which is gitignored.
#   2. The photo seed — the image bytes are not in git, so this must be run
#      from a machine holding the photo library:
#        DATABASE_URL=<render external url> bin/rails db:seed
#
services:
  - type: web
    name: sjoca
    # Docker, not the plain Ruby runtime. The editor shells out to ImageMagick,
    # Chromium, ffmpeg, rsvg-convert and potrace, and that runtime has none of
    # them: photographs could not be uploaded, the AI could not see the page it
    # had just changed, and no bulletin PDF could be made.
    runtime: docker
    dockerfilePath: ./Dockerfile
    # 2GB. Headless Chromium takes a few hundred megabytes on its own, and on
    # 512MB the container is killed mid-screenshot -- which looks like the
    # editor dying halfway through a change rather than like running out of room.
    plan: standard
    branch: main
    # Migrations run here, not in the build: a Docker build has no database.
    # Render runs this after the image is built and before it goes live, so a
    # failed migration does not take the site down with it.
    preDeployCommand: "./bin/rails db:prepare"
    # dockerCommand, not startCommand: Render refuses a Docker service that has
    # a startCommand at all. It overrides the image's CMD.
    dockerCommand: "bundle exec puma -C config/puma.rb"
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sjoca-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false          # set by hand in the dashboard; never in git
      - key: RAILS_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: 2
      - key: RAILS_LOG_LEVEL
        value: info
      # Where this site answers. Password-reset links are built from it, and so
      # are the addresses the editor's browser checks visit. Left unset it
      # falls back to localhost, and a reset email would send people nowhere.
      # Change to https://sjoca.org at cutover.
      - key: SITE_URL
        value: https://sjoca.onrender.com

  # ChurchTrac calendar: a few times a day is plenty, and it is a light call.
  - type: cron
    name: sjoca-calendar-sync
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    branch: main
    schedule: "17 */6 * * *"
    dockerCommand: "bundle exec rake churchtrac:sync"
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: sjoca-db, property: connectionString }
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production

  # Scripture readings: each date is fetched once ever, so daily is ample.
  - type: cron
    name: sjoca-lectionary-sync
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    branch: main
    schedule: "40 5 * * *"
    dockerCommand: "bundle exec rake lectionary:sync"
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: sjoca-db, property: connectionString }
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production

  # Class recordings: Fr David posts one a week, so once a day is generous.
  - type: cron
    name: sjoca-classes-sync
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    branch: main
    schedule: "55 5 * * *"
    dockerCommand: "bundle exec rake classes:sync"
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: sjoca-db, property: connectionString }
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production

databases:
  - name: sjoca-db
    plan: basic-256mb
    databaseName: sjoca
    user: sjoca
    # The photographs live in this database, so after cutover it is the parish's
    # only copy of them. Check the backup retention on whatever plan is chosen.
